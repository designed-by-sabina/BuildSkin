<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuildSkin · Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/file-warning.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="page-calc">
  <header class="app-head">
    <a class="brand" href="index.html">BuildSkin</a>
    <span class="crumb">Building massing scale</span>
    <nav class="page-nav" id="nav"></nav>
  </header>

  <main class="work">
    <section class="stage">
      <div class="viewer viewer-main" id="viewMain">
        <div class="viewer-tools" role="toolbar">
          <div class="seg" role="radiogroup" aria-label="Click mode">
            <button data-mode="apply" class="active" role="radio" aria-checked="true">Apply assembly</button>
            <button data-mode="existing" role="radio" aria-checked="false">Mark existing to remain</button>
          </div>
          <button id="applyAll" class="link" title="Apply the selected assembly to every facade surface">Apply to all</button>
          <button id="clearAll" class="link">Clear</button>
        </div>
        <div class="viewer-legend">
          <span><i class="key key-existing"></i>Existing facade to remain</span>
        </div>
        <div class="viewer-hint">Click: apply · Shift+click: inspect · Alt+click: remove · Double-click: reset view</div>
        <div class="viewer-status" id="status"></div>
        <div class="viewer-empty" id="emptyMsg" hidden></div>
        <div class="viewer viewer-mini" id="viewMini"><span class="viewer-label">Rear</span></div>
      </div>

      <div class="panel-tabs" id="panelTabs" role="tablist">
        <button data-tab="results" class="active">Results</button>
        <button data-tab="surface">Surface</button>
        <button data-tab="layers">Layers</button>
        <button data-tab="targets">Targets</button>
      </div>
      <div class="panel data-table" id="bigTable"></div>
      <div class="panel data-table" id="miniTable" hidden></div>
      <div class="panel" id="layersPanel" hidden></div>
      <div class="panel" id="targetsPanel" hidden></div>
    </section>

    <aside class="side">
      <section class="side-block">
        <h2 class="label">Selected material mix / assembly</h2>
        <div class="mix" id="mix"></div>
        <div class="mix-detail" id="mixDetail"></div>
      </section>

      <section class="side-block">
        <h2 class="label">Explore other assemblies</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="explore" id="libGrid"></div>
        <div class="pager"><input type="range" id="pager" min="0" max="0" value="0" aria-label="Library page"></div>
        <label class="search">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.75"/><path d="M10 10l4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="Search assemblies, layers, materials" autocomplete="off">
        </label>
      </section>

      <div class="actions">
        <button id="btnCalc" class="btn primary">Calculate</button>
        <button id="btnSave" class="btn muted">Save project</button>
        <button id="btnExport" class="btn muted">Export</button>
      </div>
    </aside>
  </main>
  <script type="module" src="js/calculator.js"></script>
</body>
</html>
