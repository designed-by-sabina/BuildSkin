<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuildSkin · Massing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/file-warning.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="page-massing">
  <header class="app-head">
    <a class="brand" href="index.html">BuildSkin</a>
    <span class="crumb">Choose a massing</span>
    <nav class="page-nav" id="nav"></nav>
  </header>
  <div class="frame">
    <h1 class="title m-title">Massing</h1>

    <div class="m-split">
      <section class="m-col">
        <h2 class="m-col-head"><span class="num">01</span> Pick from the library</h2>
        <div class="massing-grid" id="libGrid"></div>
      </section>

      <section class="m-col">
        <h2 class="m-col-head"><span class="num">02</span> Or drop your own</h2>
        <label class="dropzone" id="drop">
          <input type="file" id="fileInput" accept=".obj" multiple hidden>
          <span>Drop an .obj massing here<br>or click to browse</span>
          <small>Closed, planar massing · no interior faces · set units and up-axis below · Rhino .3dm: convert with tools/3dm_to_obj.py</small>
        </label>
        <div class="massing-grid" id="uploadGrid"></div>
      </section>
    </div>

    <footer class="m-foot">
      <span id="selName"></span>
      <button class="cta" id="continue">Continue to calculator →</button>
    </footer>
  </div>
  <script type="module" src="js/massing.js"></script>
</body>
</html>
